  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    rel="stylesheet" />

  <title>Nicolas Paiva — Desenvolvedor Full Stack</title>

  <script>
    /* Tema aplicado antes da primeira pintura. Sem isto o React só grava o
       atributo num efeito, depois do paint, e o modo claro pisca escuro. */
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
